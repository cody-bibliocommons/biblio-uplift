name: sample-vaultwarden
ssh_host: server.example.com
ssh_user: deploy
ssh_key: ~/.ssh/id_ed25519
sudo: true
project_dir: /opt/myapp
compose_files:
  - docker-compose.yml
backup_dir: /var/backups/itops/sample-vaultwarden
backup_retention: 5
volumes:
  - vaultwarden_data
  - vaultwarden_vault
extra_backup_paths:
  - /opt/myapp/haproxy
  - /opt/myapp/config
healthcheck_urls:
  - https://server.example.com
healthcheck_timeout: 120
skip_os_update: false
skip_reboot: false
# ssh_port: 22
# git_branch: main
# maintenance_window: "Sun 02:00-06:00"
# on_success_cmd: "curl -X POST https://hooks.slack.com/..."
# on_failure_cmd: "curl -X POST https://hooks.slack.com/..."
pre_upgrade_hooks: []
post_upgrade_hooks: []
cleanup:
  prune_images: true
  prune_volumes: true
  prune_containers: true
  prune_build_cache: true
  log_retention_days: 30
  log_paths:
    - /var/log/syslog
    - /var/log/auth.log
