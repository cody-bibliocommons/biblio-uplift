name: itops-snipeit
ssh_host: ops-liv-ast01.bcommons.net
ssh_user: ansible
ssh_key: ~/.ssh/integration.pem
sudo: true
project_dir: /opt/docker/itops-snipeit
compose_files:
  - compose.yml
backup_dir: /var/backups/itops/itops-snipeit
backup_retention: 5
volumes:
  - snipeit01_mariadb-data
  - snipeit01_snipeit-data
extra_backup_paths:
  - /opt/docker/itops-snipeit/haproxy
  - /opt/docker/itops-snipeit/mariadb
healthcheck_urls:
  - https://ops-liv-ast01.bcommons.net
healthcheck_timeout: 120
skip_os_update: false
skip_reboot: false
# ssh_port: 22
# git_branch: main
# maintenance_window: "02:00-06:00"
# on_success_cmd: "curl -X POST https://hooks.slack.com/..."
# on_failure_cmd: "curl -X POST https://hooks.slack.com/..."
pre_upgrade_hooks: []
post_upgrade_hooks: []
# pre_upgrade_hooks:
#   - "/opt/scripts/notify-slack.sh 'Starting upgrade'"
# post_upgrade_hooks:
#   - "/opt/scripts/notify-slack.sh 'Upgrade complete'"
cleanup:
  prune_images: true
  prune_volumes: true
  prune_containers: true
  prune_build_cache: true
  log_retention_days: 30
  log_paths:
    - /var/log/syslog
    - /var/log/auth.log
