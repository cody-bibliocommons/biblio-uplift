name: itops-identity03
ssh_host: ops-liv-identity03.bcommons.net
ssh_user: ansible
ssh_key: ~/.ssh/integration.pem
sudo: true
project_dir: /opt/docker/itops-identity
compose_files:
  - compose.yml
compose_profile: hostname
backup_dir: /var/backups/itops/itops-identity03
backup_retention: 5
volumes:
  - ops-liv-identity03-pgdata
  - ops-liv-identity03-ssl
extra_backup_paths:
  - /opt/docker/itops-identity/haproxy
  - /opt/docker/itops-identity/keepalived
  - /opt/docker/itops-identity/fluent-bit
healthcheck_urls:
  - https://ops-liv-identity03.bcommons.net
healthcheck_timeout: 180
skip_os_update: false
skip_reboot: false
pre_upgrade_hooks: []
post_upgrade_hooks: []
cleanup:
  prune_images: true
  prune_volumes: false
  prune_containers: true
  prune_build_cache: true
  log_retention_days: 30
  log_paths:
    - /var/log/syslog
    - /var/log/auth.log
  cleanup_commands: []
