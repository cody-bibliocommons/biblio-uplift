[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biblio-uplift"
version = "0.1.0"
description = "TUI and CLI tool for managing Docker Compose service upgrades on remote servers via SSH"
authors = [{name = "Cody Lusk", email = "cody.lusk@bibliocommons.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["docker", "compose", "ssh", "upgrade", "tui", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual==8.2.5",
    "rich==15.0.0",
    "click==8.3.3",
    "pydantic==2.13.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "bandit==1.9.4",
    "safety==3.7.0",
    "mypy==1.20.2",
    "ruff==0.15.12",
    "types-PyYAML==6.0.12.20260408",
    "yamllint>=1.35.0",
    "mdformat>=0.7.0",
    "freezegun>=1.5.0",
]

[project.scripts]
biblio-uplift = "biblio_uplift.cli.main:cli"

[project.urls]
Homepage = "https://bitbucket.org/bibliocommons/itops-biblio-uplift"
Repository = "https://bitbucket.org/bibliocommons/itops-biblio-uplift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biblio_uplift = ["examples/*.yml", "tui/**/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["biblio_uplift"]
omit = ["*/tui/*", "*/tools/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108", "B017", "SIM108", "SIM115", "SIM117", "S604", "B007", "E501"]
"src/biblio_uplift/tui/*" = ["E501"]
"src/biblio_uplift/core/ssh.py" = ["S603"]
"src/biblio_uplift/core/pipeline.py" = ["S602"]
"src/biblio_uplift/history/audit.py" = ["S608"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["tests/", "tui/"]
